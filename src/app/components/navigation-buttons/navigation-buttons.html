<div class="grid sm:grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full mt-10">
  @for (buttons of navigationItems; track buttons.title) {
    <button
      hlmBtn
      routerLink="{{ buttons.link }}"
      class="rounded-2xl border border-border bg-card p-5 text-left shadow-soft transition hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-elegant"
    >
      <ng-icon [name]="buttons.icon" class="mr-2"></ng-icon>
      {{ buttons.title }}
    </button>
  }
</div>
